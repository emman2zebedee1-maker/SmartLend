<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoanDesk — Lending Business Manager</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#172033;--muted:#6d7890;--line:#e4e8f1;--brand:#4f46e5;--brand2:#4338ca;--soft:#eef2ff;--good:#16845b;--bad:#c2414b;--shadow:0 8px 26px #1d2a4410}
body.dark{--bg:#101522;--panel:#192132;--text:#eef2ff;--muted:#a3aec4;--line:#2b3549;--brand:#8b83ff;--brand2:#7168f5;--soft:#292747;--good:#4bd5a0;--bad:#ff818b;--shadow:0 8px 26px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.primary{background:var(--brand);color:white}.secondary{background:var(--soft);color:var(--brand)}.danger{background:#ffeded;color:#b4232e}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}.logo{display:flex;gap:10px;align-items:center;padding:0 8px;font-size:20px;font-weight:850;letter-spacing:-.5px}.logo-mark{background:var(--brand);color:white;border-radius:12px;width:38px;height:38px;display:grid;place-items:center}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;color:var(--muted);padding:12px;border-radius:11px}.nav button.active,.nav button:hover{background:var(--soft);color:var(--brand)}.side-note{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:12px}.main{padding:26px clamp(16px,3vw,38px);min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.eyebrow{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px}.topbar h1{margin:3px 0 0;font-size:clamp(24px,3vw,32px);letter-spacing:-1px}.top-actions{display:flex;gap:8px;align-items:center}.content{display:grid;gap:20px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow);min-width:0}.metric-label{color:var(--muted);font-size:13px}.metric{font-size:clamp(20px,2.5vw,29px);font-weight:800;letter-spacing:-.8px;margin:8px 0 4px;overflow-wrap:anywhere}.metric-sub{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-head h2{font-size:17px;margin:0;letter-spacing:-.3px}.two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}td strong{font-size:13px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:var(--soft);color:var(--brand)}.badge.good{background:#e5f8ef;color:#14734f}.badge.warn{background:#fff4d8;color:#926200}.empty{padding:28px;text-align:center;color:var(--muted)}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:var(--panel);color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:var(--soft);color:var(--brand);border-color:var(--brand)}.chart{height:180px;display:flex;align-items:end;gap:10px;padding:15px 4px 0}.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end;min-width:0}.bar{width:min(100%,38px);border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--brand),#9b96ff);min-height:3px}.bar-label{font-size:10px;color:var(--muted)}.bar-value{font-size:10px;color:var(--muted)}.notice{padding:12px 14px;background:var(--soft);border-radius:12px;color:var(--muted);font-size:12px}.inline-actions{display:flex;gap:6px;flex-wrap:wrap}.inline-actions button{padding:7px 9px;font-size:11px}.business-hero{display:flex;gap:14px;align-items:center;margin-bottom:20px}.avatar{width:52px;height:52px;background:var(--soft);color:var(--brand);border-radius:15px;display:grid;place-items:center;font-weight:900;font-size:20px}.muted{color:var(--muted)}.money-positive{color:var(--good)}.money-negative{color:var(--bad)}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#0b1020a8;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 80px #0004}.modal h2{margin:0 0 18px}.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--panel);padding:12px 16px;border-radius:12px;z-index:30;box-shadow:var(--shadow)}.mobile-menu{display:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.logo{padding:4px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.side-note{display:none}.main{padding:18px 13px}.topbar{align-items:flex-start}.top-actions{flex-direction:column;align-items:stretch}.cards{gap:9px}.card{padding:14px}.metric{font-size:21px}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar h1{font-size:24px}}
@media print{body{background:white;color:#111}.sidebar,.top-actions,.no-print,.inline-actions{display:none!important}.shell{display:block}.main{padding:0}.panel,.card{box-shadow:none;border:1px solid #ddd}.print-only{display:block!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="logo"><div class="logo-mark">LD</div><span id="brandName">LoanDesk</span></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button>
  <button data-page="loans">↗ &nbsp; Loans & contracts</button>
  <button data-page="payments">↻ &nbsp; Payments</button>
  <button data-page="financials">▤ &nbsp; Financial statements</button>
  <button data-page="personalbudget">▣ &nbsp; Personal Budget</button>
  <button data-page="business">⚙ &nbsp; Business profile</button>
 </nav>
 <div class="side-note"><strong>Private workspace</strong><p>Prototype data is stored in this browser on this device. Export backups regularly.</p><span id="storageStatus">Local storage enabled</span></div>
</aside>
<main class="main">
 <header class="topbar"><div><div class="eyebrow" id="todayLabel">LENDING WORKSPACE</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button class="ghost" id="themeBtn">☾ Dark mode</button><button class="secondary" id="exportBtn">Export backup</button></div></header>
 <div id="view" class="content"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:state.profile.currency||'USD',maximumFractionDigits:2}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
const monthNow=()=>today().slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,9);
const initial={profile:{name:'LoanDesk Lending',signatureName:'',email:'',phone:'',address:'',tagline:'Fair, transparent lending.',currency:'USD',theme:'light'},loans:[],budget:[],personalBudget:[],guarantors:[]};
let state;
try{state={...initial,...JSON.parse(localStorage.getItem('loandesk_data')||'{}')};state.profile={...initial.profile,...(state.profile||{})};state.loans=state.loans||[];state.budget=state.budget||[];state.personalBudget=state.personalBudget||[];state.guarantors=state.guarantors||[];state.accounting=state.accounting||{liabilities:0}}catch(e){state=structuredClone(initial)}
let page='dashboard',editingId=null,editingType=null,loanSearch='';
function save(){localStorage.setItem('loandesk_data',JSON.stringify(state));$('#brandName').textContent=state.profile.name||'LoanDesk';document.body.classList.toggle('dark',state.profile.theme==='dark');$('#themeBtn').textContent=state.profile.theme==='dark'?'☀ Light mode':'☾ Dark mode'}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(arr,fn){return arr.reduce((a,x)=>a+(Number(fn(x))||0),0)}
function loanInterest(l){return Number(l.principal||0)*Number(l.rate||0)/100*Number(l.months||1)}
function totalDue(l){return Number(l.principal||0)+loanInterest(l)}
function loanPayments(l){return Array.isArray(l.payments)?l.payments:[]}
function loanPaid(l){return sum(loanPayments(l).filter(p=>!p.reversed),p=>p.amount)}
function loanBalance(l){return Math.max(0,totalDue(l)-loanPaid(l))}
function budgetTotals(){let b=state.budget.filter(x=>(x.date||'').slice(0,7)===monthNow());return {income:sum(b.filter(x=>x.kind==='income'),x=>x.amount),expenses:sum(b.filter(x=>x.kind==='expense'),x=>x.amount)}}
function stats(){let active=state.loans.filter(x=>x.status!=='Paid'),paid=state.loans.filter(x=>x.status==='Paid');let b=budgetTotals();return {principal:sum(active,x=>x.principal),expected:sum(active,loanBalance),interest:sum(active,loanInterest),paid:sum(paid,totalDue),profit:sum(state.loans,loanInterest),income:b.income,expenses:b.expenses}}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=({dashboard:'Dashboard',loans:'Loans & contracts',payments:'Payments',financials:'Financial statements',personalbudget:'Personal Budget',business:'Business profile'})[p];render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
$('#themeBtn').onclick=()=>{state.profile.theme=state.profile.theme==='dark'?'light':'dark';save();render()};
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='loandesk-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')};
function card(label,value,sub=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div><div class="metric-sub">${sub}</div></div>`}
function loanRows(items){if(!items.length)return `<tr><td colspan="6"><div class="empty">No loans yet. Add your first loan to get started.</div></td></tr>`;return items.map(l=>{const paid=loanPaid(l),balance=loanBalance(l);return `<tr><td><strong>${esc(l.borrower)}</strong><br><span class="muted">${esc(l.id)}</span></td><td>${money(l.principal)}</td><td>${Number(l.rate||0)}% / mo</td><td><strong>${money(totalDue(l))}</strong><br><span class="muted" style="font-size:11px">Paid ${money(paid)} · Balance ${money(balance)}</span></td><td><span class="badge ${l.status==='Paid'?'good':l.status==='Overdue'?'warn':''}">${esc(l.status||'Active')}</span></td><td><div class="inline-actions">${balance>0?`<button class="primary" onclick="openPayment('${l.id}')">Pay loan</button>`:''}<button class="secondary" onclick="printDoc('${l.id}','contract')">Contract</button><button class="ghost" onclick="printDoc('${l.id}','receipt')">Receipt</button><button class="ghost" onclick="editLoan('${l.id}')">Edit</button><button class="danger" onclick="del('loans','${l.id}')">Delete</button></div></td></tr>`}).join('')}
function isLoanOverdue(l){return l.status!=='Paid' && (l.status==='Overdue' || (!!l.dueDate && l.dueDate<today()))}
function renderDashboard(){let s=stats(),b=budgetTotals(),overdue=state.loans.filter(isLoanOverdue),months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.toISOString().slice(0,7);months.push({key,label:d.toLocaleString('en-US',{month:'short'}),value:sum(state.loans.filter(l=>(l.date||'').slice(0,7)===key),loanInterest)})}let max=Math.max(1,...months.map(x=>x.value));return `<div class="cards">${card('Active principal',money(s.principal),`${state.loans.filter(x=>x.status!=='Paid').length} active loan(s)`)}${card('Expected repayments',money(s.expected),'Principal + monthly interest')}${card('Estimated interest profit',money(s.profit),'Across all recorded loans')}${card('This month cash-flow balance',money(b.income-b.expenses),`Income ${money(b.income)} · Expenses ${money(b.expenses)}`)}${card('Overdue loans',String(overdue.length),`${money(sum(overdue,totalDue))} estimated outstanding`)}</div><div class="two-col"><section class="panel"><div class="section-head"><h2>Estimated interest by loan month</h2><button class="secondary" onclick="setPage('loans')">Manage loans</button></div><div class="chart">${months.map(m=>`<div class="bar-wrap"><div class="bar-value">${m.value?money(m.value):'—'}</div><div class="bar" style="height:${Math.max(2,m.value/max*65)}%"></div><div class="bar-label">${m.label}</div></div>`).join('')}</div><p class="muted" style="font-size:12px">Estimate uses each loan's principal × monthly rate × term. Actual collections, defaults, fees and expenses may differ.</p></section><section class="panel"><div class="section-head"><h2>Quick actions</h2></div><div style="display:grid;gap:10px"><button class="primary" onclick="openLoan()">＋ Create a loan</button><button class="secondary" onclick="setPage('financials')">＋ Add income or expense</button><button class="secondary" onclick="openLoan()">＋ Create loan / add guarantor</button><button class="ghost" onclick="setPage('business')">Edit business profile</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="metric-label">Paid loans</div><div class="metric">${money(s.paid)}</div><div class="metric-sub">Recorded total due for paid loans</div></section></div><section class="panel"><div class="section-head"><h2>Overdue loans</h2><button class="ghost" onclick="setPage('loans')">View all loans →</button></div><p class="muted" style="font-size:12px">Loans marked Overdue or with a due date before today are listed here, unless marked Paid.</p><div class="table-wrap"><table><thead><tr><th>Client</th><th>Due date</th><th>Principal</th><th>Total due</th><th>Status</th><th>Actions</th></tr></thead><tbody>${overdue.length?overdue.map(l=>`<tr><td><strong>${esc(l.borrower)}</strong><br><span class="muted">${esc(l.id)}</span></td><td>${esc(l.dueDate||'Not set')}</td><td>${money(l.principal)}</td><td>${money(totalDue(l))}</td><td><span class="badge warn">Overdue</span></td><td><div class="inline-actions"><button class="secondary" onclick="editLoan('${l.id}')">Edit</button><button class="ghost" onclick="printDoc('${l.id}','contract')">Contract</button></div></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No overdue loans. Loans with past due dates will appear here automatically.</div></td></tr>`}</tbody></table></div></section><section class="panel"><div class="section-head"><h2>Recent loans</h2><button class="ghost" onclick="setPage('loans')">View all →</button></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Principal</th><th>Monthly rate</th><th>Total due</th><th>Status</th><th>Actions</th></tr></thead><tbody>${loanRows([...state.loans].slice(-5).reverse())}</tbody></table></div></section>`}
function loanMatches(l,q){if(!q)return true;const text=[l.borrower,l.id,l.clientPhone,l.clientIdNumber,l.clientAddress,l.status,l.principal,l.rate,l.months,l.date,l.dueDate,l.notes,l.guarantorName,l.guarantorPhone].map(v=>String(v??'')).join(' ').toLowerCase();return text.includes(q.toLowerCase())}
function renderLoans(){const filtered=[...state.loans].reverse().filter(l=>loanMatches(l,loanSearch.trim()));return `<div class="panel"><div class="section-head"><div><h2>Loan register</h2><div class="muted" style="font-size:12px">Monthly simple interest · contracts and receipts are printable</div></div><button class="primary" onclick="openLoan()">＋ New loan</button></div><div class="field" style="margin:0 0 14px"><label for="loanSearchInput">Search loans</label><input id="loanSearchInput" type="search" value="${esc(loanSearch)}" placeholder="Search by client name, loan ID, phone, ID number, status, or amount..." autocomplete="off"></div><div class="muted" id="loanSearchCount" style="font-size:12px;margin-bottom:8px">Showing ${filtered.length} of ${state.loans.length} loan(s)</div><div class="table-wrap"><table><thead><tr><th>Client / ID</th><th>Principal</th><th>Rate</th><th>Total due</th><th>Status</th><th>Actions</th></tr></thead><tbody id="loanSearchResults">${filtered.length?loanRows(filtered):`<tr><td colspan="6"><div class="empty">${state.loans.length?'No loans match your search. Try another name or loan detail.':'No loans yet. Add your first loan to get started.'}</div></td></tr>`}</tbody></table></div><div class="notice" style="margin-top:14px">Contract and receipt documents are templates. Review applicable local lending, disclosure, privacy and consumer-protection requirements before using them with customers.</div></div>`}
function renderPayments(){
 const rows=[];
 for(const loan of state.loans){for(const payment of loanPayments(loan)){rows.push({loan,payment})}}
 rows.sort((a,b)=>String(b.payment.date||'').localeCompare(String(a.payment.date||'')));
 const active=rows.filter(x=>!x.payment.reversed),reversed=rows.filter(x=>x.payment.reversed);
 return `<div class="cards">${card('Payments recorded',String(active.length),'Not reversed')}${card('Total collected',money(sum(active,x=>x.payment.amount)),'Across all loans')}${card('Reversed payments',String(reversed.length),'Can be restored')}${card('Loans with payments',String(new Set(active.map(x=>x.loan.id)).size),'Unique loans')}</div><section class="panel"><div class="section-head"><div><h2>Payment register</h2><div class="muted" style="font-size:12px">View receipts, edit payment details, delete records, or undo a payment by reversing it.</div></div><button class="primary" onclick="setPage('loans')">Go to Loans & Contracts</button></div><div class="table-wrap"><table><thead><tr><th>Payment date</th><th>Client / Loan</th><th>Payment ID</th><th>Note / method</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(({loan,payment})=>`<tr><td>${esc(payment.date||'')}</td><td><strong>${esc(loan.borrower||'Unknown client')}</strong><br><span class="muted">${esc(loan.id)}</span></td><td><span class="muted">${esc(payment.id||'—')}</span></td><td>${esc(payment.note||'—')}</td><td>${money(payment.amount)}</td><td><span class="badge ${payment.reversed?'warn':'good'}">${payment.reversed?'Reversed':'Recorded'}</span></td><td><div class="inline-actions"><button type="button" class="ghost" data-payment-receipt="${esc(loan.id)}" data-payment-id="${esc(payment.id)}">Receipt</button>${!payment.reversed?`<button type="button" class="secondary" data-payment-edit="${esc(loan.id)}" data-payment-id="${esc(payment.id)}">Edit</button><button type="button" class="secondary" data-payment-undo="${esc(loan.id)}" data-payment-id="${esc(payment.id)}">Undo</button>`:`<button type="button" class="secondary" data-payment-restore="${esc(loan.id)}" data-payment-id="${esc(payment.id)}">Restore</button>`}<button type="button" class="danger" data-payment-delete="${esc(loan.id)}" data-payment-id="${esc(payment.id)}">Delete</button></div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">No payments recorded yet. Use Pay loan in Loans & Contracts to record a payment.</div></td></tr>`}</tbody></table></div><p class="muted" style="font-size:12px;margin-bottom:0">Undo reverses a payment while keeping a record in this register. Delete permanently removes the payment record after confirmation. Reversed payments are excluded from collected totals and outstanding-balance calculations.</p></section>`;
}
function syncLoanPaymentStatus(loan){if(loanBalance(loan)<=0.005)loan.status='Paid';else if(loan.status==='Paid')loan.status='Active'}
function findPayment(loanId,paymentId){const loan=state.loans.find(x=>x.id===loanId);if(!loan)return null;const payment=loanPayments(loan).find(x=>String(x.id)===String(paymentId));return payment?{loan,payment}:null}
function editPayment(loanId,paymentId){
 const found=findPayment(loanId,paymentId);if(!found){toast('Payment not found');return}const {loan:l,payment:x}=found;if(x.reversed){toast('Restore this payment before editing it');return}
 const available=loanBalance(l)+Number(x.amount||0);
 $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="section-head"><h2>Edit loan payment</h2><button type="button" class="ghost" onclick="closeModal()">✕</button></div><p><strong>Client:</strong> ${esc(l.borrower)} · <strong>Loan:</strong> ${esc(l.id)}</p><form id="editPaymentForm"><div class="field-grid"><div class="field"><label>Payment amount (${esc(state.profile.currency)})</label><input name="amount" type="number" min=".01" max="${available.toFixed(2)}" step=".01" value="${esc(x.amount)}" required></div><div class="field"><label>Payment date</label><input name="date" type="date" value="${esc(x.date||today())}" required></div><div class="field full"><label>Note / payment method (optional)</label><input name="note" value="${esc(x.note||'')}"></div></div><div class="form-actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button type="submit" class="primary">Save changes</button></div></form></div></div>`;
 $('#editPaymentForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget),amount=Number(d.get('amount')),date=String(d.get('date')||''),note=String(d.get('note')||'').trim(),current=findPayment(loanId,paymentId);if(!current||!Number.isFinite(amount)||amount<=0||amount>available+0.001||!date){toast('Enter a valid amount and date');return}if(persistMutation(()=>{const target=state.loans.find(z=>z.id===loanId),pay=loanPayments(target).find(z=>String(z.id)===String(paymentId));if(!pay)throw Error('Payment not found');pay.amount=Math.round(amount*100)/100;pay.date=date;pay.note=note;syncLoanPaymentStatus(target)},'Payment updated successfully'))closeModal()};$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};
}

 $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="section-head"><h2>Edit personal budget entry</h2><button type="button" class="ghost" onclick="closeModal()">✕</button></div><form id="editPersonalBudgetForm"><div class="field-grid"><div class="field"><label>Entry type</label><select name="kind"><option value="income" ${x.kind==='income'?'selected':''}>Income</option><option value="expense" ${x.kind==='expense'?'selected':''}>Expense</option></select></div><div class="field"><label>Amount (${esc(state.profile.currency)})</label><input name="amount" type="number" min=".01" step=".01" value="${esc(x.amount)}" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${esc(x.date||today())}" required></div><div class="field"><label>Category</label><input name="category" value="${esc(x.category||'')}" required></div><div class="field full"><label>Note (optional)</label><input name="note" value="${esc(x.note||'')}"></div></div><div class="form-actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button type="submit" class="primary">Save changes</button></div></form></div></div>`;
 $('#editPersonalBudgetForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget),kind=String(d.get('kind')||''),amount=Number(d.get('amount')),date=String(d.get('date')||''),category=String(d.get('category')||'').trim(),note=String(d.get('note')||'').trim();if(!['income','expense'].includes(kind)||!Number.isFinite(amount)||amount<=0||!date||!category){toast('Please enter a valid type, amount, date and category');return}if(persistMutation(()=>{state.personalBudget=Array.isArray(state.personalBudget)?state.personalBudget:[];const exists=state.personalBudget.some(z=>z.id===id);if(!exists)throw Error('Personal budget entry not found');state.personalBudget=state.personalBudget.map(z=>z.id===id?{...z,kind,amount,date,category,note}:z)},'Personal budget entry updated')){closeModal();toast('Personal budget entry updated successfully')}};
 $('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};
}
function openPayment(id){const l=state.loans.find(x=>x.id===id);if(!l){toast('Loan not found');return}const balance=loanBalance(l);if(balance<=0){toast('This loan is already fully paid');return}const payments=[...loanPayments(l)].reverse();$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="section-head"><h2>Record loan payment</h2><button type="button" class="ghost" onclick="closeModal()">✕</button></div><p><strong>Client:</strong> ${esc(l.borrower)} · <strong>Loan:</strong> ${esc(l.id)}</p><div class="cards"><div class="card"><div class="metric-label">Total scheduled</div><div class="metric">${money(totalDue(l))}</div></div><div class="card"><div class="metric-label">Already paid</div><div class="metric">${money(loanPaid(l))}</div></div><div class="card"><div class="metric-label">Balance remaining</div><div class="metric">${money(balance)}</div></div></div><form id="loanPaymentForm"><div class="field-grid"><div class="field"><label>Payment amount (${esc(state.profile.currency)})</label><input name="amount" type="number" min=".01" max="${balance.toFixed(2)}" step=".01" required value="${balance.toFixed(2)}"></div><div class="field"><label>Payment date</label><input name="date" type="date" value="${today()}" required></div><div class="field full"><label>Note / payment method (optional)</label><input name="note" placeholder="Cash, mobile money, bank transfer..."></div></div><div class="form-actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button type="submit" class="primary">Save payment</button></div></form>${payments.length?`<h3>Previous payments</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Note</th><th>Amount</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${esc(p.date||'')}</td><td>${esc(p.note||'—')}</td><td>${money(p.amount)}</td></tr>`).join('')}</tbody></table></div>`:''}</div></div>`;const form=$('#loanPaymentForm');form.onsubmit=e=>{e.preventDefault();const d=new FormData(form),amount=Number(d.get('amount')),date=String(d.get('date')||''),note=String(d.get('note')||'').trim();const current=state.loans.find(x=>x.id===id);const due=current?loanBalance(current):0;if(!Number.isFinite(amount)||amount<=0||amount>due+0.001||!date){toast('Enter a valid payment not greater than the remaining balance');return}const payment={id:'PAY-'+uid()+'-'+Date.now().toString(36),amount:Math.round(amount*100)/100,date,note};if(persistMutation(()=>{const loan=state.loans.find(x=>x.id===id);if(!loan)throw Error('Loan not found');loan.payments=loanPayments(loan);loan.payments.push(payment);if(loanBalance(loan)<=0.005){loan.status='Paid'}else if(loan.status==='Paid'){loan.status='Active'}},'Loan payment saved successfully')){closeModal();toast(loanBalance(state.loans.find(x=>x.id===id))<=0.005?'Loan fully paid':'Loan payment recorded')}};$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function del(type,id){if(!['loans','budget','personalBudget','guarantors'].includes(type)){toast('This record type cannot be deleted here');return}const isLoan=type==='loans';if(!confirm(isLoan?'Delete this loan and all of its associated payment records? This cannot be undone. Export a backup first if you may need this information.':'Delete this record? This cannot be undone unless you exported a backup.'))return;const rows=Array.isArray(state[type])?state[type]:[];if(!rows.some(x=>String(x.id)===String(id))){toast('Record not found');return}persistMutation(()=>{state[type]=rows.filter(x=>String(x.id)!==String(id))},isLoan?'Loan and associated payments deleted':type==='personalBudget'?'Personal budget entry deleted':type==='budget'?'Business income/expense deleted':'Record deleted')}
function printDoc(id,type){

 const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('en-US'):'N/A';

 <section class="signatures"><div class="signature-party"><div class="signature-name"><b>${esc(p.signatureName||p.name||'Lender')}</b>${(p.signatureName||p.name)?`<small class="signature-date">${fmtDate(l.date||today())}</small>`:''}</div><div class="sig-line"></div><span>Authorized Signature &amp; Date</span></div><div class="signature-party"><div class="signature-name"><b>${esc(l.borrower||'Client')}</b>${l.borrower?`<small class="signature-date">${fmtDate(l.date||today())}</small>`:''}</div><div class="sig-line"></div><span>Client Signature &amp; Date</span></div><div class="signature-party"><div class="signature-name"><b>${esc(g.name||'')}</b>${g.name?`<small class="signature-date">${fmtDate(l.date||today())}</small>`:''}</div><div class="sig-line"></div><span>Guarantor Signature &amp; Date</span></div></section>
 <p class="legal-note">Review all details and applicable local lending and consumer-protection requirements before signing. This template is not a substitute for legal advice.</p>
 `:`<h2 class="doc-title">PAYMENT RECEIPT</h2><section class="party-grid"><div class="party"><h3>BUSINESS DETAILS</h3><p><b>Company:</b> ${esc(p.name)}</p><p><b>Phone:</b> ${esc(p.phone||'N/A')}</p><p><b>Address:</b> ${esc(p.address||'N/A')}</p><p><b>Email:</b> ${esc(p.email||'N/A')}</p></div><div class="party"><h3>PAYMENT DETAILS</h3><p><b>Client:</b> ${esc(l.borrower)}</p><p><b>Phone:</b> ${esc(l.clientPhone||'N/A')}</p><p><b>ID / Passport #:</b> ${esc(l.clientIdNumber||'N/A')}</p><p><b>Address:</b> ${esc(l.clientAddress||'N/A')}</p><p><b>Loan reference:</b> ${esc(l.id)}</p><p><b>Receipt date:</b> ${contractDate}</p><p><b>Loan status:</b> ${esc(l.status)}</p></div></section><section class="doc-section"><h3>Loan Summary</h3><table class="schedule"><thead><tr><th>Principal</th><th>Monthly Interest Rate</th><th>Term</th><th>Estimated Interest</th><th>Total Scheduled</th></tr></thead><tbody><tr><td>${money(l.principal)}</td><td>${Number(l.rate||0)}%</td><td>${Number(l.months||1)} month(s)</td><td>${money(interest)}</td><td><b>${money(due)}</b></td></tr></tbody></table><p>This document summarizes the loan record. It is not proof that a payment was received unless the actual amount and date paid are completed and verified.</p><p><b>Total payments recorded:</b> ${money(paid)} &nbsp; <b>Remaining balance:</b> ${money(balance)}</p><p><b>Latest payment received:</b> ${latestPayment?money(latestPayment.amount):'Not recorded'} &nbsp; <b>Payment date:</b> ${latestPayment?fmtDate(latestPayment.date):'N/A'}</p>${latestPayment?.note?`<p><b>Payment note:</b> ${esc(latestPayment.note)}</p>`:''}</section><section class="signatures receipt-signatures"><div class="signature-party"><div class="signature-name"><b>${esc(p.signatureName||p.name||'Lender')}</b>${(p.signatureName||p.name)?`<small class="signature-date">${fmtDate(l.date||today())}</small>`:''}</div><div class="sig-line"></div><span>Authorized Signature &amp; Date</span></div><div class="signature-party"><div class="signature-name"><b>${esc(l.borrower||'Client')}</b>${l.borrower?`<small class="signature-date">${fmtDate(l.date||today())}</small>`:''}</div><div class="sig-line"></div><span>Client Acknowledgment (if applicable)</span></div></section>`;
 let w=window.open('','_blank','width=900,height=1000');if(!w){alert('Allow pop-ups to print documents.');return}

rm:none}.signature-name b{font-size:10px;min-width:0;overflow-wrap:anywhere}.signature-date{font-size:9px;color:#1d293f;white-space:nowrap;margin-left:5px;font-weight:normal;flex:none}.signature-party .sig-line{margin:0;width:100%;align-self:stretch}.signatures>div{min-width:0}.sig-line{border-top:1px solid #8b9bb0;height:1px;flex:none}.signatures b{font-size:10px}.signatures span{color:#61738f;font-size:10px;margin-top:10px}.receipt-signatures{grid-template-columns:repeat(2,minmax(0,1fr))}.legal-note{margin-top:28px}.table-wrap{overflow:visible}@media print{body{margin:0 auto;padding:12mm 10mm}.doc-section,.party-grid,.signatures{break-inside:avoid}button{display:none}}@media(max-width:600px){body{padding:12px}.party-grid{gap:10px}.ref{white-space:normal}.signatures{gap:10px}.signature-name b{font-size:9px}.signature-date{font-size:8px;margin-left:3px}}

function renderFinancials(){
 const allIncome=state.budget.filter(x=>x.kind==='income'),allExpenses=state.budget.filter(x=>x.kind==='expense');
 const otherIncome=sum(allIncome,x=>x.amount),operatingExpenses=sum(allExpenses,x=>x.amount);
 const active=state.loans.filter(l=>l.status!=='Paid');
 const receivables=sum(active,l=>Number(l.principal||0));
 const estimatedInterest=sum(state.loans,l=>loanInterest(l));
 const netProfit=otherIncome+estimatedInterest-operatingExpenses;
 const cashNet=otherIncome-operatingExpenses;
 const assets=receivables+cashNet;
 const liabilities=Number(state.accounting?.liabilities||0);
 const equity=assets-liabilities;
 const incomeRows=state.budget.length?[...state.budget].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(x.category||'Uncategorized')}</td><td>${x.kind==='income'?'Other income':'Operating expense'}</td><td class="${x.kind==='income'?'money-positive':'money-negative'}">${x.kind==='income'?'+':'−'}${money(x.amount)}</td><td><div class="inline-actions"><button type="button" class="secondary" onclick="editBudget('${x.id}')">Edit</button><button type="button" class="danger" onclick="del('budget','${x.id}')">Delete</button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No business income or expense entries recorded yet.</div></td></tr>`;
 return `<div class="notice">Business reporting view based on the loans and income/expense entries currently saved in LoanDesk. This is a management estimate, not an audited or statutory financial statement. Record actual cash, payments received, bad debts, assets and all liabilities for a complete balance sheet.</div>
 <div class="cards">${card('Active loan receivables',money(receivables),`${active.length} unpaid loan(s); principal only`)}${card('Recorded other income',money(otherIncome),'All saved income entries')}${card('Recorded operating expenses',money(operatingExpenses),'All saved expense entries')}${card('Estimated net result',money(netProfit),'Income + estimated interest − expenses')}</div>
 <section class="panel"><div class="section-head"><h2>Statement of financial position (Balance Sheet)</h2><button class="secondary" onclick="window.print()">Print statement</button></div><p class="muted">As of ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}. Values are estimates from available app records.</p><div class="two-col"><div><h3>Assets</h3><div class="table-wrap"><table style="min-width:0"><tbody><tr><td>Outstanding loan principal receivable</td><td style="text-align:right">${money(receivables)}</td></tr><tr><td>Net cash movement from recorded income/expenses*</td><td style="text-align:right">${money(cashNet)}</td></tr><tr><th>Total estimated assets</th><th style="text-align:right">${money(assets)}</th></tr></tbody></table></div></div><div><h3>Liabilities &amp; equity</h3><form id="liabilityForm"><div class="field"><label>Business liabilities (enter total known debts/payables)</label><input name="liabilities" type="number" step=".01" min="0" value="${esc(liabilities)}" required></div><div class="form-actions"><button class="primary">Save liabilities</button></div></form><div class="table-wrap"><table style="min-width:0"><tbody><tr><td>Total liabilities entered</td><td style="text-align:right">${money(liabilities)}</td></tr><tr><td>Estimated owner's equity (assets − liabilities)</td><td style="text-align:right">${money(equity)}</td></tr><tr><th>Total liabilities &amp; equity</th><th style="text-align:right">${money(liabilities+equity)}</th></tr></tbody></table></div></div></div><p class="muted" style="font-size:12px">*This is net recorded cash movement, not verified bank/cash on hand. It excludes opening cash, actual loan repayments, write-offs and unrecorded transactions. Do not treat it as audited cash.</p></section>
 <section class="panel"><div class="section-head"><h2>Income statement (Profit &amp; Loss)</h2><button class="secondary" onclick="window.print()">Print statement</button></div><p class="muted">All-time estimates from recorded entries and the app's simple-interest loan calculations.</p><div class="table-wrap"><table style="min-width:0"><tbody><tr><td>Other income recorded</td><td style="text-align:right">${money(otherIncome)}</td></tr><tr><td>Estimated interest on all loans</td><td style="text-align:right">${money(estimatedInterest)}</td></tr><tr><td>Operating expenses recorded</td><td style="text-align:right">− ${money(operatingExpenses)}</td></tr><tr><th>Estimated net profit / (loss)</th><th style="text-align:right">${money(netProfit)}</th></tr></tbody></table></div><p class="muted" style="font-size:12px">Interest is estimated from principal × monthly rate × term, not actual cash collected. Paid status alone does not confirm actual interest received.</p></section>
 <section class="panel"><div class="section-head"><h2>Cash-flow entries</h2><button class="secondary" onclick="document.getElementById('businessEntryForm').scrollIntoView({behavior:'smooth'})">＋ Add entry</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Type</th><th>Amount</th><th>Actions</th></tr></thead><tbody>${incomeRows}</tbody></table></div></section>
 <section class="panel" id="businessEntryForm"><div class="section-head"><h2>Record business income or expense</h2></div><form id="budgetForm"><div class="field-grid"><div class="field"><label>Entry type</label><select name="kind"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="field"><label>Amount (${esc(state.profile.currency)})</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Category</label><input name="category" placeholder="Rent, utilities, other income..." required></div><div class="field full"><label>Note (optional)</label><input name="note" placeholder="Description or reference"></div></div><div class="form-actions"><button type="submit" class="primary">Save financial entry</button></div></form></section>`;
}
